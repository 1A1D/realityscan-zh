            <h1 data-id="h1" data-vn="2">照片与 LiDAR 扫描结合</h1>
            <p data-id="p_h1" data-vn="2">
                RealityScan 支持混合多种输入，例如图像、LiDAR 扫描、结构光三维扫描仪或深度相机。你不需要做任何特殊设置。
            </p>
            <ul>
                <li data-id="li_h1_impo" data-vn="2">首先导入数据。这一步 RealityScan 会把你的输入转换成内部的 .lsp 格式。</li>
                <li data-id="li_h1_lsp" data-vn="1">之后就像 .lsp 文件是普通图像一样继续操作：把 .lsp 文件加入项目，与其他 .lsp 文件和图像一起组合即可。</li>
            </ul>
