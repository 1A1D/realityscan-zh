<html>
<head>
    <title>RealityScan 帮助</title>
    <meta charset="UTF-8"/>
    <meta name="author" content="Epic Games Slovakia s.r.o." />
    <meta http-equiv="X-UA-Compatible" content="IE=12"/>
    <link type="text/css" rel="stylesheet" href="../../styles/style.css" />

</head>
<body ondragstart="return false;">

    <div data-id="div_cs" class="content_slide">

        <script type="text/javascript">RenderToolNavigation();</script>

        <div data-id="div_head" class="head">

            <h1 data-id="h1" data-vn="1">视线工具</h1>
            <p data-id="p_h1" data-vn="1">
                该工具通过检测投出的视线是否穿过正确的图像点，帮你验证两张或多张图像之间估算的相对运动是否准确。 
            </p>
            <p data-id="p_h1_open" data-vn="2">
                在 <span class="appaspecttype">2D</span> 视图中打开两张或更多图像，把鼠标光标<span class="appgesture">移动</span>到图像上。RealityScan 会渲染一条从相机中心出发、穿过鼠标光标尖端的视线；该视线会投影到相邻视图并带有畸变。各视线的点必须穿过同一物理对象；若没有，请用控制点来收紧场景。
            </p>
        </div>

        <br />

        <script type="text/javascript">RenderYouTubeVideo( 640, 480, "https://www.youtube.com/embed/F6PeQteOrtg" )</script>

        <div class="clear splitSpacing">
            <!-- clear -->
        </div>

        <div data-id="div_bc" class="blocksContainer">

            <script type="text/javascript">RenderBackToStartTile();</script>

        </div>

        <div class="clear">
            <!-- clear -->
        </div>

    </div>  <!-- content slide -->

    <script type="text/javascript">RenderCopyrightText();</script>

    <script type="text/javascript">
        InitializeHelpSlide();
    </script>

</body>
