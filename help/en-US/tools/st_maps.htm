    <link type="text/css" rel="stylesheet" href="../../styles/style.css"/>
    <link type="text/css" rel="stylesheet" href="../../styles/colors.css"/>

<body ondragstart="return false;">

    <div data-id="div_cs" class="content_slide">

        <script type="text/javascript">RenderToolNavigation();</script>

        <div data-id="div_head" class="head">
            <h1 data-id="h1" data-vn="1">ST Maps</h1>
            
            <p data-id="p_h1" data-vn="1">
                ST Map 记录图像畸变信息——更具体地说，是畸变图像与去畸变图像之间的映射关系。例如把渲染出的物体套合到原始图像中时就会用到它。
            </p>
        </div>

        <div data-id="div_sb_step" class="slideblock">
            <ul>
                <li data-id="li_step_prer" data-vn="1">前提：模型已完成对齐</li>
                <li data-id="li_step_acce" data-vn="2">访问路径：<span class="appribbon">Alignment</span> / <span class="apppanel">Export</span> / <span class="appribbonbutton">Registration</span> / ST Maps，或 <span class="appribbon">SCENE 3D</span>/<span class="appribbon">TOOLS</span> <span class="apppanel">Export</span> / <span class="appribbonbutton">Registration</span> / ST Maps，或 <span class="appribbon">Workflow</span> 选项卡中的通用导出工具</li>
                <li data-id="li_step_outf" data-vn="1">输出格式：.exr</li>
                <li data-id="li_step_unds" data-vn="1">关于导出对话框中去畸变设置的说明，请见 <a href="../tools/undistort.htm">Undistorted Images</a>。</li> 
            </ul>
        </div>

        <div class="clear splitSpacing">
            <!-- clear -->
        </div>

        <div data-id="div_bc" class="blocksContainer">

            <script type="text/javascript">RenderBackToStartTile();</script>

        </div>

        <div class="clear splitSpacing">
            <!-- clear -->
        </div>

    </div>

    <script type="text/javascript">RenderCopyrightText();</script>

    <script type="text/javascript">
        InitializeHelpSlide();
    </script>

</body>
</html>
