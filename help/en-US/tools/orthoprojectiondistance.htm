<html>
<head>
    <title>RealityScan 帮助</title>

    <meta name="author" content="Epic Games Slovakia s.r.o." />

    <link type="text/css" rel="stylesheet" href="../../styles/style.css" />
    <link type="text/css" rel="stylesheet" href="../../styles/colors.css" />

<body ondragstart="return false;">

    <div data-id="div_cs" class="content_slide">

        <script type="text/javascript">RenderToolNavigation();</script>

        <div data-id="div_head" class="head">

            <h1 data-id="h1" data-vn="2">正射投影的距离量测工具</h1>
            <p data-id="p_h1" data-vn="3">
                可以用 <span class="apptool">Measure Distance</span> 工具量测所显示线段两个端点之间的二维与三维距离。
            </p>
                <div style="float: left; width: 480px">
                <ul>
                    <li data-id="li_h1_cldi" data-vn="2"><span class="appgesture">点击</span> <span class="appribbon">ORTHO 2D</span>/<span class="appribbon">TOOLS</span> 选项卡 <span class="apppanel">Tools</span> 区域的 <span class="apptool">Measure Distance</span> 按钮。</li>
                    <li data-id="li_h1_disp" data-vn="2"><span class="apptool">Measure Distance</span> 工具会显示在所有正射 <span class="appaspecttype">2D</span> 视图中。</li>
                    <li data-id="li_h1_mous" data-vn="1">用鼠标<span class="appgesture">移动</span>工具线的端点。</li>
                </ul>
            </div>
        </div>

        <div class="clear splitSpacing">
            <!-- clear -->
        </div>

        <div data-id="div_bc" class="blocksContainer">

            <script type="text/javascript">RenderBackToStartTile();</script>

        </div>

        <div class="clear">
            <!-- clear -->
        </div>

    </div>

    <script type="text/javascript">RenderCopyrightText();</script>

    <script type="text/javascript">
        InitializeHelpSlide();
    </script>

</body>
