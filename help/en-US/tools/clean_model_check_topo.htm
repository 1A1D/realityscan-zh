<html>
<head>
    <title>RealityScan 帮助</title>
    <meta charset="UTF-8"/>
    <meta name="author" content="Epic Games Slovakia s.r.o." />
    <meta http-equiv="X-UA-Compatible" content="IE=10"/>
    <link type="text/css" rel="stylesheet" href="../../styles/style.css" />
    <link type="text/css" rel="stylesheet" href="../../styles/colors.css" />
    <link type="text/css" rel="stylesheet" href="../../styles/flagStyles.css" />
    <script src="../scripts/textVars.js" type="text/javascript"></script>
    <script src="../../scripts/localization.js" type="text/javascript"></script>
    <script src="../../scripts/main.js" type="text/javascript"></script>
</head>
<body ondragstart="return false;">

    <div data-id="div_cs" class="content_slide">

        <script type="text/javascript">RenderToolNavigation();</script>

        <div data-id="div_head" class="head">

            <h1 data-id="h1" data-vn="3">分析并清理网格</h1>
            <p data-id="p_h1_1" data-vn="2">
                这些工具位于 <span class="appribbon">MESH &amp; COLOR</span> 选项卡的 <span class="apppanel">Analyze</span> 区域。每个工具只对当前选中的模型执行。
            </p> 
            
                <img src="images/clean_model_check_topo-tools.png" alt="Analyze Tools" class="autoimg" onerror="this.onerror=null;this.src='../../en-US/appbasics/images/clean_model_check_topo-tools.png';">
                <br/><br/>
            
            <ul>
                <li data-id="li_int" data-vn="1"><span class="appribbonbutton">Check Integrity</span> 扫描模型以查找损坏的文件数据。</li>
                <li data-id="li_top" data-vn="1"><span class="appribbonbutton">Check Topology</span> 检查模型是否存在拓扑缺陷，例如非流形边、非流形顶点等。</li>
                <li data-id="li_mod" data-vn="1"><span class="appribbonbutton">Clean Model</span> 修复由 <span class="appribbonbutton">Check Topology</span> 工具检出的非流形顶点/边、孔洞与孤立顶点等问题。</li>
            </ul>    
   
        </div>

        <div class="clear splitSpacing">
            <!-- clear -->
        </div>

        <div data-id="div_bc" class="blocksContainer">

            <script type="text/javascript">RenderBackToStartTile();</script>

        </div>

        <div class="clear">
            <!-- clear -->
        </div>

    </div>

    <script type="text/javascript">RenderCopyrightText();</script>

    <script type="text/javascript">
        InitializeHelpSlide();
    </script>

</body>
</html>
