            <h1 data-id="h1" data-vn="2">发布并分享你的作品</h1>
            <p data-id="p_h1__v1" data-vn="2">
                模型重建完成后，就可以使用 <span class="appribbonbutton">Share</span> 功能。该按钮位于 <span class="appribbon">WORKFLOW</span> 选项卡的 <span class="apppanel">Output</span> 区域。你可以用它把模型上传到 <a href="https://www.sketchfab.com" target="_blank">Sketchfab</a>、<a href="https://cesium.com/cesium-ion/" target="_blank">Cesium Ion</a> 或 <a href="https://nira.app/" target="_blank">Nira</a>。   
            </p>
            
            <div style="padding: 20px 10px 20px 10px">
                <img src="images/share-ribbon.png" alt="share-ribbon-button" class="autoimg" onerror="this.onerror=null;this.src='../../en-US/tutorials/images/share-ribbon.png';"/>
            </div>
            
            <p data-id="p_service" data-vn="1">
                要把模型分享到这些服务，需先在相应的第三方网站注册账号并登录。
            </p>
