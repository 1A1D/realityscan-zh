        <div data-id="div_head" class="head">

            <h1 data-id="h1" data-vn="1">过滤三角面</h1>

            <p data-id="p_h1" data-vn="2">
            该工具可以移除网格中不需要的部分。过滤总会生成一个不含所选三角面的新模型。<br />
            </p>
        </div>

        <div data-id="div_sb_tool" class="slideblock">

            <p data-id="p_tool_setr" data-vn="1">首先，需要在重建模型中选中（想滤掉的）三角面：<a href="../appbasics/reconselection.htm">点击此处</a>。</p>

            <p data-id="p_tool_fise" data-vn="2">在重建模型中选中一些三角面后，<span class="apptool">Filter Selection</span> 工具才会激活。它位于应用功能区的 <span class="appribbon">SCENE 3D</span>/<span class="appribbon">TOOLS</span> 选项卡中。
                </p>

            <div data-id="div_im_mark" data-vn="1" class="importantMessage">
                注意：应用过滤后只会保留未被标记的三角面，并生成一个新模型，所以不必担心参考模型——它会保持不变。还要注意，新模型虽然放大看像点云，实际上是由实体三角面构成的。
            </div>

            <br/>
           

        </div>

        <div class="clear splitSpacing">
            <!-- clear -->
        </div>
