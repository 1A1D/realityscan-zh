<html>
    <head>
        <title>RealityScan 帮助</title>
        <meta charset="UTF-8"/>
        <meta name="author" content="Epic Games Slovakia s.r.o."/>
        <meta http-equiv="X-UA-Compatible" content="IE=10"/>
        <link type="text/css" rel="stylesheet" href="../../styles/style.css"/>
        <link type="text/css" rel="stylesheet" href="../../styles/colors.css"/>
        <link type="text/css" rel="stylesheet" href="../../styles/flagStyles.css"/>
        <script src="../scripts/textVars.js" type="text/javascript"></script>
        <script src="../../scripts/localization.js" type="text/javascript"></script>
        <script src="../../scripts/main.js" type="text/javascript"></script>
    </head>
    <body>


        <div data-id="div_cs" class="content_slide">

            <!-- content slide -->
            <script type="text/javascript">RenderToolNavigation();</script>

            <div data-id="div_head" class="head">

                <h1 data-id="h1" data-vn="1">插件</h1>
                
                    <p data-id="p_h1" data-vn="1">
                        部分工具和功能会用到 AI 模型。要切换模型，或现在/以后从应用中移除模型，请点击 <span class="appribbon">WORKFLOW</span> 功能区 <span class="apppanel">Application</span> 区域的 <span class="appbutton">Addons</span> 按钮，打开 <span class="apppanel">Addon settings</span> 面板。
                    </p>
                
                    <div style="padding: 10px 10px 10px 0px">
                        <img src="images/addon-settings.png" alt="addon-settings" class="autoimg" onerror="this.onerror=null;this.src='../../en-US/appbasics/images/addon-settings.png';"/>
                    </div> 
                
                    <ul> 
                        <li data-id="li_ver" data-vn="1">
                            <span class="appproperty">Versions</span> 选择要使用的模型版本。
                        </li>
                        <li data-id="li_upd" data-vn="1">
                            <span class="appproperty">Check for updates</span> 模型不会自动更新。用此选项可手动检查最新可用更新。
                        </li>
                        <li data-id="li_" data-vn="1">
                            <span class="appproperty">Remove model</span> 移除该模型。之后需要时可以重新下载。
                        </li>
                    </ul>
                
            </div>        
            
            <div class="clear splitSpacing">
                <!-- clear -->
            </div>
                    

            <div data-id="div_bc" class="blocksContainer">

                <script type="text/javascript">RenderBackToStartTile();</script>

            </div>

            <div class="clear">
                <!-- clear -->
            </div>

            <!-- content slide end -->
        </div>

        <script type="text/javascript">RenderCopyrightText();</script>

        <script type="text/javascript">
            InitializeHelpSlide();
        </script>

    </body>
</html>
