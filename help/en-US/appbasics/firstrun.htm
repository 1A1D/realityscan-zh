        <div data-id="div_cs" class="content_slide">

            <!-- content slide -->
            <div data-id="div_head" class="head" style="text-align:center">

                <h1 data-id="h1__v1" data-vn="2" class="firstrun">欢迎使用 <span class="fistRunSmall"><span class="lod2" style="color: #7ECEFD">Reality<strong>Scan</strong></span></span></h1>
                
                <p data-id="p_h1__v1" data-vn="2">
                    感谢安装 RealityScan —— 一款为配准图像、LiDAR 扫描等任务而设计并深度优化的先进摄影测量软件。你可以用地面或航空图像、激光扫描等多种来源，生成精美的带纹理三维模型、精确的正射投影和图像镶嵌。
                </p>
                
            </div>    
                
            <div data-id="div_sb_quick" class="slideblock" style="text-align:center"> 
            
                <p data-id="p_h2__v2" data-vn="1">
                    建议花点时间看看我们的快速入门教程，其中有界面基础介绍，以及从输入图像创建三维模型的分步指引。
                </p>
                
            </div>

                <!-- clear -->
            </div>

                        <p data-id="p_h2_bc_start" data-vn="2">启动快速入门指南</p>
                    </div>
                </a>
            </div>

            <div class="clear splitSpacing">
                <!-- clear -->
            </div>
            
            <div data-id="div_sb_help" class="slideblock">
                <p data-id="p_help" data-vn="2">
                
                在 RealityScan 帮助中还有按主题组织的更多资源，例如对齐、模型创建流程、纹理、简化和后处理工具。可以用搜索栏快速定位到需要的主题。若需更多帮助，可访问 <a href="https://dev.epicgames.com/community/unreal-engine">Epic 开发者社区</a>或我们的 <a href="https://www.youtube.com/@RealityScanOfficial">YouTube 频道</a>。
